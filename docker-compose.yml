
services:

  mongodb:
    image: "mongo"
    volumes:
      - data:/data/db

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - ./Backend/.env
    volumes:
      - logs:/app/logs
      - ./Backend:/app
      - /app/node_modules
    depends_on:
      - mongodb

  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"

    env_file:
      - ./frontend/.env
    volumes:
      - ./Frontend/src:/app/src
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  data:
  logs: